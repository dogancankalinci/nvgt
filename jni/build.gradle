buildscript {
	repositories {
		mavenCentral()
		google()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:8.10.1'
	}
}

allprojects {
	repositories {
		mavenCentral()
		google()
	}
}

apply plugin: 'com.android.application'

android {
	namespace "com.samtupy.nvgt"
	compileSdkVersion 36
	aaptOptions {
		cruncherEnabled = false  
	}
	flavorDimensions "version"
	defaultConfig {
		minSdkVersion 21
		targetSdkVersion 36
		versionCode 1
		versionName "1.0"
	}
	buildTypes {
		release {
			minifyEnabled false
			crunchPngs false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}
	productFlavors {
		runner {
			dimension "version"
			applicationId "com.samtupy.nvgt.runner"
			versionName file("../version").getText().trim()
		}
		stub {
			dimension "version"
			applicationId "com.samtupy.nvgt.stub"
		}
		stubIap {
			dimension "version"
			applicationId "com.samtupy.nvgt.stub"
		}
	}

	sourceSets {
		runner {
			jniLibs.srcDirs = ['libs/runner']
			assets.srcDirs = ['../release/include']
		}
		stub {
			jniLibs.srcDirs = ['libs/stub']
			assets.srcDirs = []
		}
		stubIap {
			java.srcDirs += ['src/iap/java']
			jniLibs.srcDirs = ['libs/stub_iap']
			assets.srcDirs = []
		}
	}
	applicationVariants.all { variant ->
		def flavorName = variant.productFlavors[0].name
		if (flavorName == "stub" || flavorName == "stubIap") {
			variant.getAssembleProvider().configure() {
				it.doLast {
					variant.outputs.each { output ->
						File apk = output.outputFile
						exec {
							commandLine "python", "makestub.py", "${variant.name}", "${buildDir}", "${apk}", "${gradle.gradleUserHomeDir.absolutePath}"
						}
					}
				}
			}
		} else {
			variant.outputs.each { output ->
				output.versionCodeOverride = (int) (new Date().getTime() / 60000.0)
			}
		}
	}
	lint {
		abortOnError false
	}
}

dependencies {
	// kotlin-bom aligns kotlin-stdlib with its pre-1.8 split jdk7/jdk8 jars: billing 9 pulls
	// stdlib 1.8.22 while other transitives pull *-jdk8:1.6.21, tripping checkDuplicateClasses.
	stubIapImplementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
	// Pinned to exactly 8.0.0: Google Play requires PBL 8+ after 2026-08-31, and 8.0.0 is the
	// only 8+/9 release whose own manifest still allows minSdk 21 (8.1.0+ and 9.x require 23).
	// Bumping this past 8.0.0 therefore forces the stubIap flavor's minSdk up to 23.
	stubIapImplementation 'com.android.billingclient:billing:8.0.0'
}
